name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check for Gradle wrapper
        id: wrapper
        run: |
          if [ -f ./gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Gradle wrapper yet (before milestone M1). Skipping build."
          fi

      - name: Set up JDK 17
        if: steps.wrapper.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.wrapper.outputs.present == 'true'
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the removed 'tools' package, which now fails.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install SDK packages
        if: steps.wrapper.outputs.present == 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        if: steps.wrapper.outputs.present == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        if: steps.wrapper.outputs.present == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleOssDebug assemblePlayDebug testOssDebugUnitTest testPlayDebugUnitTest
          # From M4 on: fail on any network/analytics library on the runtime classpath (spec section 6).
          if ./gradlew --no-daemon -q tasks --all | grep -q 'checkNoRemoteDeps'; then
            ./gradlew --no-daemon checkNoRemoteDeps
          fi

      - name: Verify shared debug signing key
        if: steps.wrapper.outputs.present == 'true'
        # Every debug APK must carry the public shared key (keystore/README.md), never a fresh CI key,
        # so Bill's installs update over each other.
        run: |
          PIN="9ab99dd804089b3cb826d5d485f129a532ee995317e65be553a32c3d8112a905"
          for apk in $(find app/build/outputs/apk -name '*-debug.apk'); do
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee /dev/stderr \
              | grep -qi "SHA-256 digest: $PIN" || { echo "::error::$apk is not signed with the shared debug key"; exit 1; }
          done

      - name: Lint
        if: steps.wrapper.outputs.present == 'true'
        # Blocking since M13. On failure the plain-text report is printed so every issue shows in the log.
        run: |
          ./gradlew --no-daemon lintOssDebug lintPlayDebug || {
            cat app/build/reports/lint-results-ossDebug.txt app/build/reports/lint-results-playDebug.txt 2>/dev/null; exit 1; }

      - name: Upload debug APK (oss)
        if: steps.wrapper.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fafo-debug-apk-oss
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error

      - name: Upload debug APK (play)
        if: steps.wrapper.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fafo-debug-apk-play
          path: app/build/outputs/apk/play/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always() && steps.wrapper.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore
